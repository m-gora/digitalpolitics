[project]
name = "dpp"
version = "0.1.0"
description = "Digital Politics Platform - Campaign Canvas module prototype"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "openai>=3.19.2",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.54",
    "sse-starlette>=3.4.11",
    "uvicorn[standard]>=0.53.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff.lint]
# B008: FastAPI's Depends()-in-default-argument is the standard idiom, not a bug.
ignore = ["B008"]
