services:
  db:
    build:
      context: ./db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dpp
      POSTGRES_PASSWORD: dpp
      POSTGRES_DB: dpp
    ports:
      - "5432:5432"
    volumes:
      - dpp_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpp -d dpp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dpp_db_data:
