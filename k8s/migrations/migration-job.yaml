apiVersion: batch/v1
kind: Job
metadata:
  name: dpp-migration
  namespace: dpp
  annotations:
    # Forward-only migrations: keep the last completed run for inspection.
    dpp/migration: alembic
spec:
  # Recreate the Job on each reconcile; alembic upgrade head is idempotent.
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          # NOTE: keep the image tag in sync with k8s/app/deployment.yaml;
          # dependabot bumps both via the docker ecosystem.
          image: ghcr.io/m-gora/digital-politics-platform:v1.2.0
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          workingDir: /app
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dpp-db
                  key: DATABASE_URL
