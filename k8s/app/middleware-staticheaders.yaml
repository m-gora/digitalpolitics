# Static role / district-scope injection (adr-03). There is no per-user
# authorization data in the IdP yet, so every authenticated user gets the
# same scope set. These values were previously injected by the legacy
# Caddyfile on the Compose server.
#
# TODO(marco): replace the placeholder with the real X-District-Scopes value
# from the legacy Caddyfile (comma-separated district UUIDs; must match the
# districts created by dpp.seed during the reseed).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dpp-static-headers
  namespace: dpp
spec:
  headers:
    customRequestHeaders:
      X-User-Roles: "member"
      X-District-Scopes: "REPLACE-ME"
