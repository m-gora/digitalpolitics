# Main traffic: everything except /oauth2/* goes to dpp behind the
# forward-auth chain. The oauth2-proxy sidecar terminates the auth flow
# (start/callback) directly.
#
# Attached to the existing cluster Gateway (kube-system/cluster, class
# traefik); TLS is terminated there with the infra-owned wildcard cert for
# *.cloud.marcodoes.tech. external-dns creates the DNS record for the
# hostname (label below).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dpp
  namespace: dpp
  labels:
    # Label filter: no-dash prefix on purpose (matches the cluster's
    # --label-filter in cluster-config/external-dns.yaml).
    externaldns.kubernetes.io/enabled: "true"
  annotations:
    # Annotations: dash prefix (external-dns's default AnnotationPrefix — the
    # no-dash label spelling does NOT work for annotations).
    external-dns.kubernetes.io/cloudflare-proxied: "true"
    external-dns.kubernetes.io/cloudflare-custom-hostname: dpp.cloud.marcodoes.tech
spec:
  parentRefs:
    - name: cluster
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - dpp.cloud.marcodoes.tech
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2
      backendRefs:
        - name: dpp
          port: 4180
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: dpp-forwardauth
      backendRefs:
        - name: dpp
          port: 8000
