# Unauthenticated health endpoint for flux/probes/pagers. The exact-path match
# wins over the / prefix rule in httproute.yaml, bypassing the forward-auth
# chain (k8s probes bypass the Gateway anyway; this keeps /healthz usable
# through the public URL for uptime checks).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dpp-healthz
  namespace: dpp
  labels:
    externaldns.kubernetes.io/enabled: "true"
spec:
  parentRefs:
    - name: cluster
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - dpp.cloud.marcodoes.tech
  rules:
    - matches:
        - path:
            type: Exact
            value: /healthz
      backendRefs:
        - name: dpp
          port: 8000
