# --- dpp app (non-secret env; secrets come from the dpp-db / dpp-app Secrets) ---
APP_ENV=production
AI_PROVIDER=google
GOOGLE_EMBEDDING_MODEL=
GOOGLE_TEXT_MODEL=gemini-3.5-flash-lite
OPENAI_TEXT_MODEL=gpt-4o-mini
OPENAI_TRANSCRIBE_MODEL=gpt-4o-transcribe
TYPESAFE_MODEL=jev-latest
MAP_TILE_URL=https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png

# Forward-auth header names (arch-01). Defaults match the oauth2-proxy
# sidecar; override here if the proxy layer changes again.
# Roles are not injected anywhere (the app never consumed X-User-Roles);
# district scopes come from the groups claim expanded by dpp.gliederungen.
DPP_USER_ID_HEADER=X-Auth-Request-User
DPP_USER_GROUPS_HEADER=X-Auth-Request-Groups
DPP_USER_NAME_HEADER=X-Auth-Request-Preferred-Username
DPP_USER_EMAIL_HEADER=X-Auth-Request-Email

# Gliederung config file (mounted from the dpp-gliederungen ConfigMap).
DPP_GLIEDERUNGEN_FILE=/etc/dpp/gliederungen/gliederungen.yaml

# --- oauth2-proxy sidecar (non-secret; Auth0 credentials in dpp-auth) ---
OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
OAUTH2_PROXY_UPSTREAMS=static://200
OAUTH2_PROXY_PROVIDER=oidc
# Custom-domain issuer: auth.marcodoes.tech is verified in Auth0, so tokens
# issued via the hosted login carry iss=https://auth.marcodoes.tech/ and
# discovery already points the authorize endpoint at the custom domain.
OAUTH2_PROXY_OIDC_ISSUER_URL=https://auth.marcodoes.tech/
# The Auth0 Action injects the party's Gliederung memberships as a
# namespaced claim; oauth2-proxy relays it as X-Auth-Request-Groups, which
# Traefik forwards because it is listed in authResponseHeaders.
OAUTH2_PROXY_OIDC_GROUPS_CLAIM=https://dpp/groups
OAUTH2_PROXY_COOKIE_SECURE=true
OAUTH2_PROXY_COOKIE_DOMAINS=dpp.cloud.marcodoes.tech
OAUTH2_PROXY_WHITELIST_DOMAINS=dpp.cloud.marcodoes.tech
OAUTH2_PROXY_EMAIL_DOMAINS=*
OAUTH2_PROXY_SET_XAUTHREQUEST=true
# Root-path forwardAuth mode: redirect unauthenticated requests straight to
# the IdP instead of serving the oauth2-proxy button page (Traefik passes the
# 302 through).
OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
OAUTH2_PROXY_PASS_ACCESS_TOKEN=false
OAUTH2_PROXY_REVERSE_PROXY=true
