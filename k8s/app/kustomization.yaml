apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# One tree, one flux Kustomization. namespace, the postgres ExternalName
# service and the SOPS-encrypted secrets live here too (kustomize/flux
# cannot load resources above this directory).
#
# configMapGenerator hash-suffixes both ConfigMaps, so any config change
# (including the Gliederung YAML) produces a new ConfigMap name and the
# Deployment rolls the pods automatically on flux reconcile.
configMapGenerator:
  - name: dpp-config
    envs:
      - configmap.yaml
  - name: dpp-gliederungen
    files:
      - gliederungen.yaml
resources:
  - namespace.yaml
  - postgres-externalname.yaml
  - secret-dpp-db.yaml
  - secrets-sops.yaml
  - service.yaml
  - deployment.yaml
  - middleware-forwardauth.yaml
  - httproute.yaml
  - httproute-healthz.yaml
generatorOptions:
  disableNameSuffixHash: false
