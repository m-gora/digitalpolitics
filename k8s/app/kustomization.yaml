apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# namespace, postgres ExternalName and the dpp-db secret live in
# k8s/migrations (kustomize/flux cannot load resources above this directory,
# and flux orders dpp-app after dpp-migrations via dependsOn). This tree only
# contains the app itself; secretKeyRefs resolve against the objects the
# migrations tree applies.
resources:
  - configmap.yaml
  - secrets-sops.yaml
  - service.yaml
  - deployment.yaml
  - middleware-forwardauth.yaml
  - middleware-staticheaders.yaml
  - httproute.yaml
  - httproute-healthz.yaml
