version: 2
updates:
  # Image-tag bumps for the k8s manifests (initContainer + app container pin
  # the same image, so they can never diverge).
  - package-ecosystem: docker
    directory: "/k8s/app"
    schedule:
      interval: weekly
    groups:
      dpp-image:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
