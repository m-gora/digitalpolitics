name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: SemVer release tag to deploy (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate and send deployment request
        env:
          DEPLOY_TAG: ${{ inputs.tag }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Tag must be a v-prefixed SemVer tag, e.g. v1.2.3" >&2
            exit 1
          }
          [[ -n "$DEPLOY_WEBHOOK_URL" && -n "$DEPLOY_WEBHOOK_TOKEN" ]] || {
            echo "Set DEPLOY_WEBHOOK_URL and DEPLOY_WEBHOOK_TOKEN repository secrets" >&2
            exit 1
          }
          jq -n --arg tag "$DEPLOY_TAG" '{tag: $tag}' > "$RUNNER_TEMP/deploy.json"
          curl --fail-with-body --silent --show-error \
            --max-time 900 \
            -H "Authorization: Bearer ${DEPLOY_WEBHOOK_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/deploy.json" \
            "$DEPLOY_WEBHOOK_URL"
