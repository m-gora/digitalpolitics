name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag_name: ${{ steps.semantic.outputs.new_release_git_tag }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cycjimmy/semantic-release-action@v4
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          semantic_version: 24
          tag_format: v${version}

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.release.outputs.tag_name }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=semver,pattern=v{{major}},value=${{ needs.release.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/metadata-action@v5
        id: updater-meta
        with:
          images: ghcr.io/${{ github.repository }}-updater
          tags: |
            type=raw,value=${{ needs.release.outputs.tag_name }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=semver,pattern=v{{major}},value=${{ needs.release.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: ./deploy/updater
          file: ./deploy/updater/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.updater-meta.outputs.tags }}
          labels: ${{ steps.updater-meta.outputs.labels }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,scope=updater,mode=max
